services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rag_ai_tutor
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the project .env file}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_ai_tutor"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  service:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD}@db:5432/rag_ai_tutor
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in the project .env file}
      LEARNER_ID_SALT: ${LEARNER_ID_SALT:?Set LEARNER_ID_SALT in the project .env file}
      SERVICE_TASK_DATABASE: /data/service_issued_tasks.sqlite
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      GENERATION_MODEL: ${GENERATION_MODEL:-qwen3:8b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      HF_HOME: /data/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVICE_PORT:-8800}:8000"
    volumes:
      - ../lmsrag/artifacts:/app/lmsrag/artifacts:ro
      - ../lmsrag/data:/app/lmsrag/data:ro
      - service-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  postgres-data:
  service-data:
