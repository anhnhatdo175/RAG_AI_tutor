# Data v1 configuration (plan tab "Quy ước chung", section 5). Paths are relative to the repository root.
data_seed: 2026
seeds: [0, 1, 2, 3, 4]
split: {history: 0.70, validation: 0.15, test: 0.15, min_user_interactions: 20}
difficulty: {shrinkage_m: 20, min_responses_unit: 200}
rt_clip_ms: [500, 120000]
bootstrap: {n_resamples: 1000}
datasets:
  assist2009: {path: lmsrag/data/assistments/skill_builder_data.csv, encoding: latin-1, sample_users: null}
  assist2012: {path: lmsrag/data/raw/assistments_2012/2012-2013-data-with-predictions-4-final.csv, encoding: ISO-8859-15, chunksize: 400000, sample_users: null}
  junyi2015: {path: lmsrag/data/raw/junyi_2015/junyi_ProblemLog_original.csv, chunksize: 2000000, sample_users: 20000}
output_dir: lmsrag/artifacts/v2
tables_dir: reports/tables
